<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信實集團 - 現場職安巡檢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .app-bg {
            background-color: #f0f4f8;
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(219, 234, 254, 0.95) 100%), url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        #signaturePad { border: 2px dashed #94a3b8; border-radius: 1rem; width: 100%; height: 350px; touch-action: none; background-color: #f8fafc; }
        .hidden-smooth { display: none; opacity: 0; }
        .show-smooth { display: flex; opacity: 1; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        input[type="radio"] { width: 1.5rem; height: 1.5rem; cursor: pointer; accent-color: #2563eb; }
        select optgroup { font-weight: 900; font-size: 1.25rem; }
        select option { font-weight: 700; font-size: 1.1rem; }
    </style>
</head>
<body class="app-bg min-h-screen flex items-start sm:items-center justify-center p-3 sm:p-4 transition-all">

    <!-- 登入區塊 -->
    <div id="loginSection" class="glass-panel w-full max-w-md rounded-2xl p-6 sm:p-8 transform transition-all mt-8 sm:mt-0">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-800 flex flex-col items-center justify-center gap-3 tracking-tight">
                <img src="https://lh3.googleusercontent.com/d/1EGg_mHTfjhqscarvitDCKKAqWN7eLFSl" alt="Logo" class="h-12 object-contain" crossorigin="anonymous">
                <span class="text-blue-700 mt-2">職安巡檢系統</span>
            </h1>
        </div>
        <div class="space-y-6">
            <div>
                <label class="block text-base font-bold text-blue-800 mb-2">👤 員工姓名</label>
                <input type="text" id="empName" placeholder="輸入中文姓名" class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 outline-none text-lg focus:border-blue-400">
            </div>
            <div>
                <label class="block text-base font-bold text-blue-800 mb-2">📅 出生年月日 (如 801230)</label>
                <input type="text" id="empDob" placeholder="輸入 6 碼數字" maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/\D/g, '');" class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 outline-none text-lg focus:border-blue-400">
            </div>
            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg text-xl transition active:scale-95">
                進入巡檢系統
            </button>
        </div>
    </div>

    <!-- 巡檢表單區塊 -->
    <div id="formSection" class="glass-panel w-full max-w-3xl rounded-3xl p-5 sm:p-8 mt-4 sm:mt-0 hidden">
        <div class="flex flex-col gap-4 mb-6 border-b-2 border-gray-200 pb-5">
            <h2 class="text-3xl font-extrabold text-gray-800 flex items-center justify-center sm:justify-start gap-3">
                <img src="https://lh3.googleusercontent.com/d/1EGg_mHTfjhqscarvitDCKKAqWN7eLFSl" alt="Logo" class="h-10" crossorigin="anonymous">
                現場職安巡檢表
            </h2>
            <div class="flex items-center justify-center bg-blue-100/80 border border-blue-200 text-blue-900 px-5 py-3 rounded-xl text-lg font-bold shadow-sm w-full relative">
                <button onclick="window.location.reload();" class="absolute left-2 bg-white text-blue-800 px-3 py-1 rounded-lg text-sm font-bold shadow hover:bg-blue-50 active:scale-95 transition">登出</button>
                <span class="ml-8">巡檢員：<span id="displayInspector" class="ml-1"></span></span>
            </div>
        </div>

        <form id="inspectionForm" onsubmit="submitForm(event)" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-base font-bold text-gray-800 mb-2">巡檢日期</label>
                    <input type="text" id="inspectDate" readonly class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 bg-gray-100 font-bold text-lg">
                </div>
                <div>
                    <label class="block text-base font-bold text-gray-800 mb-2">📍 GPS 定位與地圖</label>
                    <div class="flex flex-col gap-3">
                        <div class="flex gap-2">
                            <input type="text" id="gpsLocation" readonly placeholder="尚未取得定位" class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 bg-gray-50 text-sm font-bold text-gray-600">
                            <button type="button" onclick="getLocation()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3.5 rounded-xl text-base font-bold shadow-md transition whitespace-nowrap active:scale-95">定位</button>
                        </div>
                        <div id="mapContainer" class="hidden-smooth flex-col gap-2">
                            <iframe id="mapFrame" class="w-full h-32 sm:h-40 rounded-xl border border-gray-300 shadow-sm" frameborder="0" scrolling="no"></iframe>
                            <a id="mapLink" href="#" target="_blank" class="text-sm text-blue-600 font-bold hover:underline bg-blue-50 py-2 rounded-lg text-center border border-blue-100">🗺️ 開啟 Google 地圖 App</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 自動氣象與熱危害資訊區塊 -->
            <div id="weatherBlock" class="hidden-smooth flex-col mt-2 bg-blue-50 border border-blue-200 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center gap-2 mb-3">
                    <h4 class="font-extrabold text-blue-800 text-lg">🌤️ 現場氣象與熱危害資訊</h4>
                </div>
                <div class="bg-white p-4 rounded-xl border border-dashed border-blue-300 text-base space-y-2 shadow-sm" id="weatherInfo">
                    <p class="text-gray-500 font-bold text-center">🔄 氣象資料讀取中...</p>
                </div>
            </div>

            <div class="bg-blue-50/60 p-5 rounded-2xl border border-blue-100 space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-base font-bold text-gray-800 mb-2">航廈 </label>
                        <select id="locationMajor" required class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 outline-none bg-white text-lg font-medium">
                            <option value="">請選擇航廈...</option>
                            <option value="T1航廈">T1 航廈</option>
                            <option value="T2航廈">T2 航廈</option>
                            <option value="航站外圍道路">航站外圍道路</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-base font-bold text-gray-800 mb-2">區域 </label>
                        <select id="locationMinor" required class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 outline-none bg-white text-lg font-medium">
                            <option value="">請選擇區域...</option>
                            <option value="管制區">管制區</option>
                            <option value="非管制區">非管制區</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-base font-bold text-gray-800 mb-2">詳細巡檢位置 (可自行輸入)</label>
                    <input type="text" id="locationDetail" required placeholder="例如：候機室南邊 至 南機坪" class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white outline-none text-lg focus:border-blue-400">
                </div>
            </div>

            <div>
                <label class="block text-base font-bold text-gray-800 mb-2">作業項目</label>
                <select id="taskType" required onchange="renderChecklist()" class="w-full px-4 py-4 rounded-xl border-2 border-blue-300 text-blue-900 font-extrabold outline-none bg-white text-xl shadow-sm focus:border-blue-500 transition">
                    <option value="" class="text-gray-500">請選擇本次作業項目...</option>
                    <optgroup label="🟢 ━━ 一般作業 ━━" style="color: #15803d; font-size: 1.25rem;">
                        <option value="廁所/地面清潔" style="color: #15803d;">廁所/地面清潔</option>
                        <option value="洗地打蠟" style="color: #15803d;">洗地打蠟</option>
                        <option value="玻璃與設施除塵" style="color: #15803d;">玻璃與設施除塵</option>
                        <option value="其他清潔作業" style="color: #15803d;">其他清潔作業</option>
                    </optgroup>
                    <optgroup label="🔴 ━━ 高風險作業 ━━" style="color: #b91c1c; font-size: 1.25rem;">
                        <option value="高處作業(A字梯)" style="color: #b91c1c;">高處作業 (A字梯)</option>
                        <option value="高空工作車/升降平台" style="color: #b91c1c;">高空工作車/升降平台</option>
                        <option value="吊籠作業" style="color: #b91c1c;">吊籠作業</option>
                        <option value="臨路作業" style="color: #b91c1c;">臨路作業</option>
                    </optgroup>
                </select>
            </div>

            <div id="checklistContainer" class="bg-gray-50 p-4 sm:p-6 rounded-2xl border border-gray-200 space-y-6 hidden-smooth flex-col">
                <h3 class="font-extrabold text-xl text-gray-800 border-b-2 border-gray-300 pb-3 flex items-center gap-2">🛡️ 安全檢核項目</h3>
                <div id="dynamicQuestions" class="space-y-6 mt-2"></div>
                
                <div class="mt-8 border-t-2 border-gray-200 pt-6">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block font-extrabold text-lg text-gray-800">📸 現場整體巡檢照片 (可選多張)</label>
                        <button type="button" id="aiCheckBtn" onclick="runAiCheck()" class="hidden bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-sm font-bold py-2 px-4 rounded-xl shadow-md hover:shadow-lg transition transform active:scale-95 flex items-center gap-1">
                            ✨ AI 智能檢核
                        </button>
                    </div>
                    <input type="file" id="generalPhoto" accept="image/*" multiple class="w-full text-base text-gray-500 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-blue-100 file:text-blue-800 hover:file:bg-blue-200 transition shadow-sm">
                    <div id="generalPhotoPreview" class="flex flex-wrap gap-3 mt-4"></div>
                    
                    <div id="aiResultBox" class="hidden mt-4 p-4 bg-purple-50 border border-purple-200 rounded-xl shadow-inner">
                        <h4 class="font-bold text-purple-800 mb-2 flex items-center gap-2">🤖 AI 督導分析結果：</h4>
                        <div id="aiResultText" class="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed"></div>
                    </div>
                </div>
            </div>

            <div id="signatureSection" class="mt-10 bg-white p-5 sm:p-6 rounded-3xl border border-gray-200 shadow-md hidden-smooth flex-col">
                <label class="block font-extrabold text-xl text-gray-800 mb-2">巡檢人員簽名確認 <span class="text-red-500">*</span></label>
                <p class="text-sm font-bold text-red-600 bg-red-50 py-1.5 px-3 rounded-lg inline-block mb-4">⚠️ 必須簽署完整中文全名!</p>
                <canvas id="signaturePad"></canvas>
                <div class="flex justify-end mt-4">
                    <button type="button" onclick="clearSignature()" class="text-base bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2.5 rounded-xl font-bold shadow-sm transition active:scale-95">清除重簽</button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 px-4 rounded-2xl shadow-xl text-xl hidden-smooth justify-center transition active:scale-95">
                📤 傳送巡檢紀錄
            </button>
        </form>
    </div>

    <script>
        // === ⚠️ 請務必替換為您專屬的 Google Apps Script 網址 ===
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkVb8Gtg1IgGi-qP8A6HtClBzetZf2uXiqdKco11ueU_yqfQPRbuwhsNs1WKFWDZEH/exec'; 
        
        let currentUser = ''; let uploadedPhotos = {}; let questionData = []; let generalPhotosList = []; 
        let currentWeatherData = null;

        // 獨立前端視圖切換
        function switchView(view) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('formSection').style.display = 'none';
            
            if (view === 'login') document.getElementById('loginSection').style.display = 'block';
            if (view === 'form') document.getElementById('formSection').style.display = 'block';
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const MAX_WIDTH = 800; 
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6)); 
                }; img.src = event.target.result;
            }; reader.readAsDataURL(file);
        }

        document.getElementById('generalPhoto').addEventListener('change', function(e) {
            Array.from(e.target.files).forEach(file => { compressImage(file, function(base64) { generalPhotosList.push(base64); renderGeneralPhotos(); }); });
            e.target.value = ''; 
        });

        function renderGeneralPhotos() {
            const container = document.getElementById('generalPhotoPreview'); container.innerHTML = '';
            const aiBtn = document.getElementById('aiCheckBtn');
            
            if (generalPhotosList.length > 0) { aiBtn.classList.remove('hidden'); } 
            else { aiBtn.classList.add('hidden'); document.getElementById('aiResultBox').classList.add('hidden'); }

            generalPhotosList.forEach((base64, index) => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="relative inline-block mt-2">
                        <img src="${base64}" class="h-24 w-24 sm:w-32 sm:h-32 object-cover rounded-xl border border-gray-300 shadow-sm">
                        <button type="button" onclick="removeGeneralPhoto(${index})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-7 h-7 flex items-center justify-center text-lg font-bold shadow-md active:scale-95 focus:outline-none">×</button>
                    </div>`);
            });
        }
        
        function removeGeneralPhoto(index) { generalPhotosList.splice(index, 1); renderGeneralPhotos(); }

        async function runAiCheck() {
            if (generalPhotosList.length === 0) return;

            let apiKey = localStorage.getItem('GEMINI_API_KEY');
            if (apiKey) apiKey = apiKey.trim();
            
            if (!apiKey) {
                apiKey = prompt("請輸入您的 Gemini API 金鑰 (僅會安全儲存於設備端)：");
                if (!apiKey) return;
                apiKey = apiKey.trim();
                localStorage.setItem('GEMINI_API_KEY', apiKey);
            }

            const btn = document.getElementById('aiCheckBtn');
            const resultBox = document.getElementById('aiResultBox');
            const resultText = document.getElementById('aiResultText');

            btn.innerHTML = '🔄 AI 視覺分析與智慧路由中...';
            btn.disabled = true;
            resultBox.classList.remove('hidden');
            resultText.innerHTML = '<span class="text-purple-600 animate-pulse font-bold">AI 督導正在仔細檢查人員裝備與環境，若遇網路塞車將自動切換備援通道，請稍候...</span>';

            try {
                const base64Image = generalPhotosList[0].split(',')[1];
                const promptText = "你是一位嚴格的機場職安督導與人因工程專家。請檢查這張現場作業照片：1. 【個人防護具】：人員是否有穿戴反光背心、安全帽等必要護具？ 2. 【墜落預防】：若有梯子或高空作業，是否有防滑或防墜措施？ 3. 【人因工程】：工作姿勢是否有不當（如過度彎腰）？ 4. 【環境整潔】：周遭動線是否有絆倒風險？請用繁體中文條列式回答，發現問題標示『⚠️』並給予改善建議，狀況良好標示『✅』。";

                const fallbackModels = ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-2.5-flash'];
                let data = null; let finalAiText = ''; let successModel = '';

                for (let model of fallbackModels) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }] })
                        });
                        data = await response.json();

                        if (data.error && (data.error.code === 400 || data.error.code === 403 || data.error.status === 'PERMISSION_DENIED')) {
                            localStorage.removeItem('GEMINI_API_KEY'); 
                            resultText.innerHTML = `<span class="text-red-600 font-bold">❌ API 金鑰無效或已被限制，請重新整理網頁後點擊以輸入新金鑰。</span>`;
                            btn.innerHTML = '✨ 重新 AI 檢核'; btn.disabled = false; return;
                        }

                        if (data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
                            finalAiText = data.candidates[0].content.parts[0].text; successModel = model; break; 
                        }
                    } catch (e) { console.warn(`${model} 發生網路錯誤，嘗試切換備援...`); }
                }

                if (finalAiText) {
                    let formattedText = finalAiText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-purple-900">$1</strong>');
                    formattedText += `<br><br><span class="text-xs text-gray-400">⚡ Powered by ${successModel}</span>`;
                    resultText.innerHTML = formattedText;
                } else if (data && data.error) {
                    resultText.innerHTML = `<span class="text-red-600 font-bold">❌ 伺服器全線滿載或發生錯誤：<br>${data.error.message}</span>`;
                } else {
                    resultText.innerHTML = '<span class="text-orange-500 font-bold">⚠️ 無法辨識，或 AI 判斷照片包含敏感內容而拒絕回答。</span>';
                }

            } catch (error) { console.error(error); resultText.innerHTML = `<span class="text-red-600 font-bold">❌ 網路連線錯誤：${error.message}</span>`; } 
            finally { btn.innerHTML = '✨ 重新 AI 檢核'; btn.disabled = false; }
        }

        function setTodayDate() {
            const today = new Date(); const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0'); const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('inspectDate').value = `${yyyy}-${mm}-${dd}`;
        }

        async function fetchWeather(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FTaipei`);
                const data = await res.json(); const current = data.current;
                const temp = current.temperature_2m; const hum = current.relative_humidity_2m;
                const heatIndex = current.apparent_temperature; const wind = current.wind_speed_10m;

                let heatLevel = "未達預警標準"; let heatColor = "text-gray-500";
                if (heatIndex >= 26.7 && heatIndex < 32.2) { heatLevel = "第一級：注意"; heatColor = "text-green-600"; }
                else if (heatIndex >= 32.2 && heatIndex < 40.6) { heatLevel = "第二級：格外注意"; heatColor = "text-yellow-600"; }
                else if (heatIndex >= 40.6 && heatIndex < 54.4) { heatLevel = "第三級：危險"; heatColor = "text-orange-500"; }
                else if (heatIndex >= 54.4) { heatLevel = "第四級：極度危險"; heatColor = "text-red-600"; }

                let windText = `${wind} m/s`; let windStyle = "font-normal";
                if (wind >= 10) { windText = `${wind} m/s (⚠️ 已達強風標準)`; windStyle = "font-extrabold text-red-600"; }

                let heatWarningHtml = "";
                if (heatIndex >= 54.4 || temp >= 34) {
                    heatWarningHtml += `<div class="mt-2 pt-2 border-t border-red-200">`;
                    if (heatIndex >= 54.4) heatWarningHtml += `<p class="font-bold text-red-600 text-sm mb-0.5">⚠️ 現場熱危害風險等級達第四級時，於11時至14時高溫時段停止戶外高溫作業。</p>`;
                    if (temp >= 34) heatWarningHtml += `<p class="font-bold text-red-600 text-sm">⚠️ 現場氣溫達攝氏34度時停止戶外高溫作業。</p>`;
                    heatWarningHtml += `</div>`;
                }

                currentWeatherData = { temp, hum, heatIndex, heatLevel, heatColor, wind };

                document.getElementById('weatherInfo').innerHTML = `
                    <p class="font-bold text-gray-700">🌡️ 實際溫度：<span class="font-normal">${temp}°C</span> / 濕度：<span class="font-normal">${hum}%</span></p>
                    <p class="font-bold text-gray-700">🔥 換算熱指數：<span class="${heatColor} font-extrabold text-lg">${heatIndex} (${heatLevel})</span></p>
                    <p class="font-bold text-gray-700">💨 十分鐘平均風速：<span class="${windStyle}">${windText}</span></p>
                    ${heatWarningHtml}
                `;
                document.getElementById('weatherBlock').classList.remove('hidden-smooth'); document.getElementById('weatherBlock').classList.add('show-smooth');
            } catch(e) { document.getElementById('weatherInfo').innerHTML = `<p class="text-red-500 font-bold">⚠️ 無法取得即時氣象資訊</p>`; }
        }

        function getLocation() {
            const gpsInput = document.getElementById('gpsLocation'); const mapContainer = document.getElementById('mapContainer');
            const mapFrame = document.getElementById('mapFrame'); const mapLink = document.getElementById('mapLink');
            gpsInput.value = "定位中...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => { 
                        const lat = pos.coords.latitude.toFixed(6); const lon = pos.coords.longitude.toFixed(6);
                        gpsInput.value = `${lat}, ${lon}`; 
                        mapFrame.src = `https://maps.google.com/maps?q=${lat},${lon}&z=16&output=embed`;
                        mapLink.href = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                        mapContainer.classList.remove('hidden-smooth'); mapContainer.classList.add('show-smooth');
                        fetchWeather(lat, lon);
                    },
                    err => { gpsInput.value = "定位失敗，請確認手機權限"; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        function fetchWithRetry(url, retries = 2) {
            return fetch(url, { redirect: 'follow', cache: 'no-store' })
                .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.text(); })
                .catch(err => {
                    if (retries > 0) return new Promise(resolve => setTimeout(resolve, 1000)).then(() => fetchWithRetry(url, retries - 1));
                    throw err; 
                });
        }

        function handleLogin() {
            const name = document.getElementById('empName').value.trim(); const dob = document.getElementById('empDob').value.trim();
            const btn = document.getElementById('loginBtn');
            if (!name || !/^[\u4E00-\u9FA5]+$/.test(name)) { alert('⚠️ 請輸入有效的中文姓名（不可包含英文、數字或空白）。'); return; }
            if (!/^\d{6}$/.test(dob)) { alert('⚠️ 請確認生日為 6 碼數字。'); return; }

            btn.innerHTML = '🔄 安全連線與資料同步中...'; btn.disabled = true;
            const timestamp = new Date().getTime();
            const url = `${GOOGLE_SCRIPT_URL}?action=checkStaff&name=${encodeURIComponent(name)}&dob=${dob}&t=${timestamp}`;

            fetchWithRetry(url)
            .then(text => {
                let authRes; try { authRes = JSON.parse(text); } catch (e) { throw new Error("回傳格式異常"); }
                if (authRes.status !== "success") { alert('❌ 登入失敗：查無此員工姓名或生日錯誤！'); btn.innerHTML = '進入巡檢系統'; btn.disabled = false; return; }
                if (authRes.questions && authRes.questions.length > 0) { questionData = authRes.questions; finishLogin(name); } 
                else {
                    fetchWithRetry(`${GOOGLE_SCRIPT_URL}?t=${timestamp}`).then(qText => { questionData = JSON.parse(qText); finishLogin(name); })
                    .catch(err => { alert('題庫下載失敗，請檢查網路或稍後再試。'); btn.innerHTML = '進入巡檢系統'; btn.disabled = false; });
                }
            })
            .catch(err => { alert('系統連線不穩，請檢查網路或稍後再試。'); btn.innerHTML = '進入巡檢系統'; btn.disabled = false; });
        }

        function finishLogin(name) {
            currentUser = name; switchView('form'); document.getElementById('displayInspector').textContent = name;
            setTodayDate(); getLocation(); resizeCanvas(); document.getElementById('loginBtn').innerHTML = '進入巡檢系統'; document.getElementById('loginBtn').disabled = false;
        }

        function renderChecklist() {
            const task = document.getElementById('taskType').value; const dq = document.getElementById('dynamicQuestions');
            const container = document.getElementById('checklistContainer');
            dq.innerHTML = ''; uploadedPhotos = {}; isCanvasSized = false; clearSignature(); 
            if(!task) { container.classList.remove('show-smooth'); return; } container.classList.add('show-smooth');

            const filteredQuestions = questionData.filter(q => !q.applicable || q.applicable === "通用" || q.applicable.includes(task));
            filteredQuestions.forEach((q, index) => {
                const qId = q.id || `q${index + 1}`;
                dq.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 question-block" data-qid="${qId}">
                        <label class="block text-xl font-extrabold text-gray-900 mb-3 leading-snug"><span class="text-blue-600 mr-1">[${q.category}]</span> ${q.item}</label>
                        <p class="text-base sm:text-lg text-gray-600 mb-5 border-l-4 border-blue-400 pl-3 leading-relaxed bg-blue-50/50 py-2 pr-2 rounded-r-lg">${q.standard}</p>
                        <div class="flex gap-8 mb-2">
                            <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="${qId}" value="正常" required onchange="toggleException('${qId}', false); checkCompletion();" class="text-blue-600"> <span class="text-xl font-extrabold text-green-700">正常</span></label>
                            <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="${qId}" value="異常" onchange="toggleException('${qId}', true); checkCompletion();" class="text-red-600"> <span class="text-xl font-extrabold text-red-600">異常</span></label>
                        </div>
                        <div id="${qId}_exception" class="hidden-smooth flex-col mt-4 p-4 bg-red-50 border border-red-100 rounded-xl space-y-4">
                            <input type="text" id="${qId}Note" placeholder="✍️ 異常狀況說明 *" class="w-full px-4 py-3 text-base rounded-lg border border-red-200 outline-none focus:border-red-400">
                            <input type="file" accept="image/*" multiple onchange="handleExceptionPhoto('${qId}', this)" class="w-full text-sm text-gray-600 file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-white file:text-red-700 file:border file:border-red-200 hover:file:bg-red-100 shadow-sm cursor-pointer">
                            <div id="${qId}_photoPreview" class="flex flex-wrap gap-3 mt-2"></div>
                        </div>
                    </div>`);
            });
            document.getElementById('signatureSection').classList.remove('show-smooth'); document.getElementById('submitBtn').classList.remove('show-smooth');
        }

        function toggleException(qId, isAbnormal) {
            const el = document.getElementById(`${qId}_exception`); const noteInput = document.getElementById(`${qId}Note`);
            if (isAbnormal) { el.classList.add('show-smooth'); noteInput.setAttribute('required', 'true'); } 
            else { el.classList.remove('show-smooth'); noteInput.removeAttribute('required'); noteInput.value = ''; uploadedPhotos[qId] = []; document.getElementById(`${qId}_photoPreview`).innerHTML = ''; }
        }

        function handleExceptionPhoto(qId, input) {
            if (!uploadedPhotos[qId]) uploadedPhotos[qId] = [];
            Array.from(input.files).forEach(file => { compressImage(file, function(base64) { uploadedPhotos[qId].push(base64); renderExceptionPhotos(qId); }); });
            input.value = ''; 
        }

        function renderExceptionPhotos(qId) {
            const container = document.getElementById(`${qId}_photoPreview`); container.innerHTML = '';
            if (uploadedPhotos[qId] && uploadedPhotos[qId].length > 0) {
                uploadedPhotos[qId].forEach((base64, index) => {
                    container.insertAdjacentHTML('beforeend', `<div class="relative inline-block mt-2"><img src="${base64}" class="h-20 w-20 object-cover rounded-lg border border-red-200 shadow-sm"><button type="button" onclick="removeExceptionPhoto('${qId}', ${index})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold shadow-md active:scale-95 focus:outline-none">×</button></div>`);
                });
            }
        }
        function removeExceptionPhoto(qId, index) { uploadedPhotos[qId].splice(index, 1); renderExceptionPhotos(qId); }

        function checkCompletion() {
            const total = document.querySelectorAll('.question-block').length; const answered = document.querySelectorAll('input[type="radio"]:checked').length;
            if (answered === total && total > 0) { document.getElementById('signatureSection').classList.add('show-smooth'); document.getElementById('submitBtn').classList.add('show-smooth'); setTimeout(resizeCanvas, 100); }
        }

        const canvas = document.getElementById('signaturePad'); const ctx = canvas.getContext('2d');
        let isDrawing = false, signatureDistance = 0, lastPos = {x: 0, y: 0}, minX = 9999, maxX = 0, strokeCount = 0; 
        let isCanvasSized = false; 
        function resizeCanvas() { if (isCanvasSized || canvas.offsetWidth === 0) return; const ratio = Math.max(window.devicePixelRatio || 1, 1); canvas.width = canvas.offsetWidth * ratio; canvas.height = canvas.offsetHeight * ratio; ctx.scale(ratio, ratio); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f172a'; isCanvasSized = true; }
        window.addEventListener('resize', resizeCanvas);
        function getPos(e) { const rect = canvas.getBoundingClientRect(); return e.type.includes('touch') ? { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top } : { x: e.clientX - rect.left, y: e.clientY - rect.top }; }
        function startDrawing(e) { isDrawing = true; lastPos = getPos(e); strokeCount++; if(lastPos.x < minX) minX = lastPos.x; if(lastPos.x > maxX) maxX = lastPos.x; ctx.beginPath(); ctx.moveTo(lastPos.x, lastPos.y); e.preventDefault(); }
        function draw(e) { if (!isDrawing) return; e.preventDefault(); const currentPos = getPos(e); if(currentPos.x < minX) minX = currentPos.x; if(currentPos.x > maxX) maxX = currentPos.x; ctx.lineTo(currentPos.x, currentPos.y); ctx.stroke(); signatureDistance += Math.sqrt(Math.pow(currentPos.x - lastPos.x, 2) + Math.pow(currentPos.y - lastPos.y, 2)); lastPos = currentPos; }
        function stopDrawing() { isDrawing = false; ctx.closePath(); }
        function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); signatureDistance = 0; minX = 9999; maxX = 0; strokeCount = 0; }
        canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing); canvas.addEventListener('mouseout', stopDrawing); canvas.addEventListener('touchstart', startDrawing, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false }); canvas.addEventListener('touchend', stopDrawing);

        function submitForm(e) {
            e.preventDefault();
            if (strokeCount < 6 || (maxX - minX) < 150 || signatureDistance < 900) { alert('⚠️ 筆劃不足！請簽署完整中文全名。'); return; }
            const submitBtn = document.getElementById('submitBtn'); submitBtn.innerHTML = '🔄 上傳中...'; submitBtn.disabled = true;

            let answersObj = {}, notesObj = {};
            document.querySelectorAll('.question-block').forEach((block) => {
                const qId = block.getAttribute('data-qid');
                answersObj[qId] = document.querySelector(`input[name="${qId}"]:checked`)?.value || ''; notesObj[qId] = document.getElementById(`${qId}Note`)?.value || '';
            });
            if(currentWeatherData) { notesObj['_weather'] = JSON.stringify(currentWeatherData); }

            const data = {
                inspector: currentUser, inspectDate: document.getElementById('inspectDate').value,
                locationMajor: document.getElementById('locationMajor').value, locationMinor: document.getElementById('locationMinor').value,
                locationDetail: document.getElementById('locationDetail').value, gpsLocation: document.getElementById('gpsLocation').value, 
                taskType: document.getElementById('taskType').value, answers: answersObj, notes: notesObj, photos: uploadedPhotos,
                generalPhotos: generalPhotosList, signature: canvas.toDataURL('image/png')
            };

            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(data), mode: 'no-cors' }).then(() => {
                alert('✅ 成功寫入系統！'); window.location.reload();
            }).catch(error => { alert('提交失敗'); submitBtn.innerHTML = '📤 傳送巡檢紀錄'; submitBtn.disabled = false; });
        }
    </script>
</body>
</html>
